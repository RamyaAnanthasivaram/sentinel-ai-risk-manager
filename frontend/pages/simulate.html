<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Sentinel — Simulate Transaction
    </title>


    <link
        rel="stylesheet"
        href="../css/style.css"
    >


    <style>

        .form-panel {
            background: white;
            border-radius: 14px;
            padding: 24px;
            box-shadow:
                0 3px 14px
                rgba(15, 23, 42, 0.06);
        }


        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }


        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }


        .field label {
            color: #475569;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .3px;
        }


        .field input,
        .field select {

            width: 100%;
            box-sizing: border-box;

            border: 1px solid #dbe2ea;

            border-radius: 9px;

            padding: 11px 12px;

            font-family: inherit;

            font-size: 12px;

            outline: none;

        }


        .field input:focus,
        .field select:focus {

            border-color: #2563eb;

        }


        .notice {

            margin-bottom: 18px;

            padding: 12px 14px;

            border-radius: 9px;

            background: #fff7ed;

            border: 1px solid #fed7aa;

            color: #9a3412;

            font-size: 11px;

            line-height: 1.5;

        }


        .button-row {

            display: flex;

            gap: 10px;

            margin-top: 20px;

        }


        .btn {

            border: none;

            border-radius: 8px;

            padding: 11px 16px;

            font-family: inherit;

            font-size: 11px;

            font-weight: 700;

            cursor: pointer;

        }


        .btn-primary {

            background: #2563eb;

            color: white;

        }


        .btn-secondary {

            background: #e5e7eb;

            color: #172033;

        }


        .btn:disabled {

            opacity: .6;

            cursor: not-allowed;

        }


        .result {

            display: none;

            margin-top: 18px;

        }


        .result.show {

            display: block;

        }


        .result-card {

            border-radius: 12px;

            padding: 20px;

            border: 1px solid #dbe2ea;

            background: #f8fafc;

        }


        .result-card.allow {

            background: #ecfdf5;

            border-color: #bbf7d0;

        }


        .result-card.review {

            background: #fffbeb;

            border-color: #fde68a;

        }


        .result-card.block {

            background: #fffafa;

            border-color: #fecaca;

        }


        .result-header {

            display: flex;

            justify-content: space-between;

            align-items: flex-start;

            gap: 12px;

        }


        .result-title {

            font-size: 18px;

            font-weight: 800;

        }


        .result-id {

            color: #64748b;

            font-size: 11px;

            margin-top: 4px;

        }


        .result-grid {

            display: grid;

            grid-template-columns: repeat(4, 1fr);

            gap: 10px;

            margin-top: 16px;

        }


        .result-metric {

            background: white;

            border-radius: 8px;

            padding: 11px;

        }


        .metric-label {

            color: #64748b;

            font-size: 8px;

            text-transform: uppercase;

        }


        .metric-value {

            margin-top: 4px;

            font-size: 15px;

            font-weight: 750;

        }


        .result-reasons {

            margin-top: 14px;

            background: white;

            border-radius: 8px;

            padding: 12px;

            color: #475569;

            font-size: 11px;

            line-height: 1.5;

        }


        .error-box {

            display: none;

            margin-top: 16px;

            padding: 12px;

            border-radius: 8px;

            background: #fef2f2;

            border: 1px solid #fecaca;

            color: #991b1b;

            font-size: 11px;

        }


        .error-box.show {

            display: block;

        }


        .connection-status {

            margin-top: 10px;

            font-size: 10px;

            color: #64748b;

        }


        .connection-status.ok {

            color: #166534;

        }


        .connection-status.error {

            color: #991b1b;

        }


        .success-link {

            display: inline-block;

            margin-top: 14px;

            color: #2563eb;

            text-decoration: none;

            font-size: 11px;

            font-weight: 700;

        }


        @media (max-width: 800px) {

            .form-grid {

                grid-template-columns: 1fr;

            }


            .result-grid {

                grid-template-columns: repeat(2, 1fr);

            }

        }


        @media (max-width: 500px) {

            .result-grid {

                grid-template-columns: 1fr;

            }

        }

    </style>

</head>


<body data-page="simulate">


<div class="app">


    <aside
        class="sidebar"
        id="sidebar"
    ></aside>


    <main class="main">


        <div class="page-header">

            <div>

                <h1 class="page-title">
                    Simulate Transaction
                </h1>

                <div class="page-subtitle">
                    Send a test transaction through Sentinel's risk pipeline
                </div>

            </div>


            <div class="status">

                <span class="status-dot"></span>

                Test Mode

            </div>

        </div>


        <section class="form-panel">


            <div class="notice">

                <strong>
                    TEST TRANSACTION ONLY
                </strong>

                <br>

                No real money is transferred.
                This sends a transaction event to Sentinel for
                risk scoring, policy evaluation, review creation,
                and audit logging.

            </div>


            <div class="form-grid">


                <div class="field">

                    <label>
                        Transaction ID
                    </label>

                    <input
                        id="transaction_id"
                        type="text"
                        placeholder="TX-TEST-10001"
                    >

                </div>


                <div class="field">

                    <label>
                        Amount
                    </label>

                    <input
                        id="amount"
                        type="number"
                        step="0.01"
                        min="0"
                        placeholder="250.00"
                    >

                </div>


                <div class="field">

                    <label>
                        Customer ID
                    </label>

                    <input
                        id="customer_id"
                        type="text"
                        placeholder="CUS-TEST-001"
                    >

                </div>


                <div class="field">

                    <label>
                        Merchant ID
                    </label>

                    <input
                        id="merchant_id"
                        type="text"
                        value="MER-001"
                    >

                </div>


                <div class="field">

                    <label>
                        Payment Method
                    </label>

                    <select
                        id="payment_method"
                    >

                        <option value="card">
                            card
                        </option>

                        <option value="upi">
                            upi
                        </option>

                        <option value="bank_transfer">
                            bank_transfer
                        </option>

                        <option value="wallet">
                            wallet
                        </option>

                    </select>

                </div>


                <div class="field">

                    <label>
                        Device ID
                    </label>

                    <input
                        id="device_id"
                        type="text"
                        placeholder="DEV-TEST-001"
                    >

                </div>


                <div class="field">

                    <label>
                        IP Address
                    </label>

                    <input
                        id="ip_address"
                        type="text"
                        placeholder="10.10.10.50"
                    >

                </div>


                <div class="field">

                    <label>
                        Region
                    </label>

                    <input
                        id="region"
                        type="text"
                        value="REGION-TEST"
                    >

                </div>


            </div>


            <div class="button-row">

                <button
                    class="btn btn-primary"
                    id="submitButton"
                    type="button"
                    onclick="submitTransaction()"
                >
                    Score Transaction
                </button>


                <button
                    class="btn btn-secondary"
                    type="button"
                    onclick="generateTransaction()"
                >
                    Generate Test Data
                </button>

            </div>


            <div
                id="errorBox"
                class="error-box"
            ></div>


            <div
                id="connectionStatus"
                class="connection-status"
            >
                Connecting to Sentinel API...
            </div>


            <div
                id="result"
                class="result"
            ></div>


        </section>


    </main>


</div>


<!-- =========================================================
     SHARED APP
     ========================================================= -->

<script src="../js/app.js?v=4"></script>


<script>

/* =========================================================
   API
   ========================================================= */

const SIMULATOR_API =
    "https://sentinel-ai-risk-manager.onrender.com";


/* =========================================================
   FALLBACK SIDEBAR
   ========================================================= */

function mountSimulatorSidebar() {

    const sidebar =
        document.getElementById(
            "sidebar"
        );


    if (!sidebar) {
        return;
    }


    /*
       Only create the fallback if the shared
       app.js has not already populated it.
    */

    if (
        sidebar.innerHTML.trim() !== ""
    ) {
        return;
    }


    sidebar.innerHTML = `

        <div class="logo">

            <div class="logo-title">
                SENTINEL
            </div>

            <div class="logo-subtitle">
                AI RISK MANAGER
            </div>

        </div>


        <div class="nav-section">
            OVERVIEW
        </div>


        <a
            class="nav-link"
            href="dashboard.html"
        >
            <span class="nav-icon">
                🏠
            </span>
            Dashboard
        </a>


        <div class="nav-section">
            RISK
        </div>


        <a
            class="nav-link"
            href="transactions.html"
        >
            <span class="nav-icon">
                💳
            </span>
            Transactions
        </a>


        <a
            class="nav-link active"
            href="simulate.html"
        >
            <span class="nav-icon">
                🧾
            </span>
            Simulate Transaction
        </a>


        <a
            class="nav-link"
            href="regional.html"
        >
            <span class="nav-icon">
                🌍
            </span>
            Regional Risk
        </a>


        <a
            class="nav-link"
            href="spikes.html"
        >
            <span class="nav-icon">
                📈
            </span>
            Fraud Spikes
        </a>


        <div class="nav-section">
            OPERATIONS
        </div>


        <a
            class="nav-link"
            href="incidents.html"
        >
            <span class="nav-icon">
                🚨
            </span>
            Incidents
        </a>


        <a
            class="nav-link"
            href="investigations.html"
        >
            <span class="nav-icon">
                🔎
            </span>
            Investigations
        </a>


        <a
            class="nav-link"
            href="reviews.html"
        >
            <span class="nav-icon">
                👤
            </span>
            Human Review
        </a>


        <div class="nav-section">
            GOVERNANCE
        </div>


        <a
            class="nav-link"
            href="audit.html"
        >
            <span class="nav-icon">
                📋
            </span>
            Audit Log
        </a>


        <a
            class="nav-link"
            href="policy.html"
        >
            <span class="nav-icon">
                ⚙️
            </span>
            Policy &amp; Thresholds
        </a>


        <a
            class="nav-link"
            href="health.html"
        >
            <span class="nav-icon">
                🩺
            </span>
            System Health
        </a>

    `;

}


/* =========================================================
   GENERATE TEST DATA
   ========================================================= */

function generateTransaction() {

    const number =
        Math.floor(
            10000 +
            Math.random() * 90000
        );


    document.getElementById(
        "transaction_id"
    ).value =
        `TX-TEST-${number}`;


    /*
       Generate across low / review / block ranges
       so the simulator can demonstrate different
       policy outcomes.
    */

    const scenario =
        Math.random();


    let amount;


    if (scenario < 0.33) {

        amount =
            50 +
            Math.random() * 49;

    }

    else if (scenario < 0.66) {

        amount =
            100 +
            Math.random() * 99;

    }

    else {

        amount =
            200 +
            Math.random() * 300;

    }


    document.getElementById(
        "amount"
    ).value =
        amount.toFixed(2);


    document.getElementById(
        "customer_id"
    ).value =
        `CUS-TEST-${number}`;


    document.getElementById(
        "merchant_id"
    ).value =
        "MER-001";


    document.getElementById(
        "device_id"
    ).value =
        `DEV-TEST-${number}`;


    document.getElementById(
        "ip_address"
    ).value =
        `10.10.10.${Math.floor(
            10 +
            Math.random() * 200
        )}`;


    document.getElementById(
        "region"
    ).value =
        "REGION-TEST";

}


/* =========================================================
   ERROR
   ========================================================= */

function showError(
    message
) {

    const errorBox =
        document.getElementById(
            "errorBox"
        );


    errorBox.textContent =
        message;


    errorBox.classList.add(
        "show"
    );

}


/* =========================================================
   RESULT
   ========================================================= */

function showResult(
    data
) {

    const result =
        document.getElementById(
            "result"
        );


    const decision =
        String(
            data &&
            data.decision &&
            data.decision.action
                ? data.decision.action
                : data &&
                  data.decision
                    ? data.decision
                    : ""
        )
        .toUpperCase();


    const risk =
        data &&
        data.risk
            ? data.risk
            : {};


    const reasons =
        data &&
        data.decision &&
        Array.isArray(
            data.decision.reasons
        )
            ? data.decision.reasons
            : [];


    const resultClass =
        decision === "ALLOW"
            ? "allow"
            : decision === "REVIEW"
                ? "review"
                : decision === "BLOCK"
                    ? "block"
                    : "";


    result.innerHTML = `

        <div
            class="
                result-card
                ${resultClass}
            "
        >

            <div class="result-header">

                <div>

                    <div class="result-title">
                        Transaction Scored
                    </div>

                    <div class="result-id">

                        ${
                            data &&
                            data.transaction_id
                                ? data.transaction_id
                                : "—"
                        }

                    </div>

                </div>


                ${
                    decision
                        ? `
                            <span
                                class="badge ${decision}"
                            >
                                ${decision}
                            </span>
                        `
                        : ""
                }

            </div>


            <div class="result-grid">


                <div class="result-metric">

                    <div class="metric-label">
                        Risk Probability
                    </div>

                    <div class="metric-value">

                        ${Number(
                            risk.risk_probability || 0
                        ).toFixed(6)}

                    </div>

                </div>


                <div class="result-metric">

                    <div class="metric-label">
                        Risk Score
                    </div>

                    <div class="metric-value">

                        ${Number(
                            risk.risk_score || 0
                        ).toFixed(2)}

                    </div>

                </div>


                <div class="result-metric">

                    <div class="metric-label">
                        Risk Level
                    </div>

                    <div class="metric-value">

                        ${
                            risk.risk_level || "—"
                        }

                    </div>

                </div>


                <div class="result-metric">

                    <div class="metric-label">
                        Model
                    </div>

                    <div class="metric-value">

                        ${
                            risk.model_version ||
                            "Sentinel-V1"
                        }

                    </div>

                </div>


            </div>


            <div class="result-reasons">

                <strong>
                    Decision:
                </strong>

                ${
                    decision || "—"
                }


                ${
                    reasons.length
                        ? `

                            <br><br>

                            <strong>
                                Reasons:
                            </strong>

                            ${reasons.join(
                                ", "
                            )}

                        `
                        : ""
                }

            </div>


            <a
                class="success-link"
                href="transactions.html"
            >
                Open Transaction Monitor →
            </a>


        </div>

    `;


    result.classList.add(
        "show"
    );

}


/* =========================================================
   CHECK CONNECTION
   ========================================================= */

async function checkConnection() {

    const status =
        document.getElementById(
            "connectionStatus"
        );


    try {

        const response =
            await fetch(
                SIMULATOR_API +
                "/health"
            );


        if (!response.ok) {
            throw new Error(
                `HTTP ${response.status}`
            );
        }


        const data =
            await response.json();


        if (
            data.status ===
            "healthy"
        ) {

            status.textContent =
                "Sentinel API connected";

            status.classList.add(
                "ok"
            );

        }

    }

    catch (error) {

        status.textContent =
            "Sentinel API connection failed";

        status.classList.add(
            "error"
        );


        console.error(
            "API health check:",
            error
        );

    }

}


/* =========================================================
   SUBMIT TRANSACTION
   ========================================================= */

async function submitTransaction() {

    const button =
        document.getElementById(
            "submitButton"
        );


    const errorBox =
        document.getElementById(
            "errorBox"
        );


    const result =
        document.getElementById(
            "result"
        );


    errorBox.classList.remove(
        "show"
    );


    result.classList.remove(
        "show"
    );


    const transactionId =
        document.getElementById(
            "transaction_id"
        ).value.trim();


    const amount =
        Number(
            document.getElementById(
                "amount"
            ).value
        );


    const customerId =
        document.getElementById(
            "customer_id"
        ).value.trim();


    const merchantId =
        document.getElementById(
            "merchant_id"
        ).value.trim();


    const paymentMethod =
        document.getElementById(
            "payment_method"
        ).value;


    const deviceId =
        document.getElementById(
            "device_id"
        ).value.trim();


    const ipAddress =
        document.getElementById(
            "ip_address"
        ).value.trim();


    const region =
        document.getElementById(
            "region"
        ).value.trim();


    /* =====================================================
       VALIDATION
       ===================================================== */

    if (!transactionId) {

        showError(
            "Please enter a Transaction ID."
        );

        return;

    }


    if (
        !Number.isFinite(
            amount
        ) ||
        amount <= 0
    ) {

        showError(
            "Please enter a valid amount."
        );

        return;

    }


    if (!customerId) {

        showError(
            "Please enter a Customer ID."
        );

        return;

    }


    if (!merchantId) {

        showError(
            "Please enter a Merchant ID."
        );

        return;

    }


    if (!deviceId) {

        showError(
            "Please enter a Device ID."
        );

        return;

    }


    if (!ipAddress) {

        showError(
            "Please enter an IP address."
        );

        return;

    }


    if (!region) {

        showError(
            "Please enter a region."
        );

        return;

    }


    /* =====================================================
       REQUEST BODY
       ===================================================== */

    const body = {

        transaction_id:
            transactionId,

        amount:
            amount,

        customer_id:
            customerId,

        merchant_id:
            merchantId,

        payment_method:
            paymentMethod,

        device_id:
            deviceId,

        ip_address:
            ipAddress,

        region:
            region,

        model_features: {}

    };


    button.disabled =
        true;


    button.textContent =
        "Scoring...";


    try {

        const response =
            await fetch(
                SIMULATOR_API +
                "/api/transactions",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"
                    },

                    body:
                        JSON.stringify(
                            body
                        )
                }
            );


        let data = null;


        try {

            data =
                await response.json();

        }

        catch (_) {}


        if (!response.ok) {

            throw new Error(

                data &&
                data.detail

                    ? data.detail

                    : `HTTP ${response.status}`

            );

        }


        showResult(
            data
        );

    }


    catch (error) {

        console.error(
            "Transaction submission error:",
            error
        );


        showError(
            error.message ||
            "Unable to submit transaction."
        );

    }


    finally {

        button.disabled =
            false;


        button.textContent =
            "Score Transaction";

    }

}


/* =========================================================
   START
   ========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        mountSimulatorSidebar();

        checkConnection();

    }
);

</script>


</body>

</html>
